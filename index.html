<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tap Away 3D</title>
  
  <!-- CDN接続の事前確立 (高速化) -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Three.js (3D描画) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls (カメラ操作) -->

  <!-- TWEEN (アニメーション) -->

  <style>
    /* iPhone / モバイル誤操作の完全遮断 */
    * {
      box-sizing: border-box;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: radial-gradient(circle at 50% 38%, #f8fafc 0%, #e2e8f0 55%, #cbd5e1 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    .tap-hint-pulse {
      animation: tapPulse 1.8s ease-in-out infinite;
    }
    @keyframes tapPulse {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .score-pop {
      animation: scorePopAnim 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes scorePopAnim {
      0% { transform: scale(1); }
      50% { transform: scale(1.24); color: #2563eb; text-shadow: 0 0 12px rgba(37, 99, 235, 0.4); }
      100% { transform: scale(1); }
    }
    .timer-urgency {
      animation: timerPulse 0.9s ease-in-out infinite;
      color: #ef4444 !important;
    }
    @keyframes timerPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.8; }
    }

    /* ─── 軽量インラインCSS ─── */
    .relative { position: relative; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .justify-between { justify-content: space-between; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .items-baseline { align-items: baseline; }
    .justify-center { justify-content: center; }
    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .z-10 { z-index: 10; }
    .z-20 { z-index: 20; }
    .z-40 { z-index: 40; }
    .z-50 { z-index: 50; }
    .fixed { position: fixed; }
    .absolute { position: absolute; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .pt-4 { padding-top: 1rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .px-3\.5 { padding-left: 0.875rem; padding-right: 0.875rem; }
    .py-1\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
    .px-1\.5 { padding-left: 0.375rem; padding-right: 0.375rem; }
    .py-0\.5 { padding-top: 0.125rem; padding-bottom: 0.125rem; }
    .p-6 { padding: 1.5rem; }
    .p-2 { padding: 0.5rem; }
    .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
    .py-3\.5 { padding-top: 0.875rem; padding-bottom: 0.875rem; }
    .px-2\.5 { padding-left: 0.625rem; padding-right: 0.625rem; }
    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    
    .bg-white\/90 { background-color: rgba(255, 255, 255, 0.9); }
    .bg-white\/95 { background-color: rgba(255, 255, 255, 0.95); }
    .bg-white { background-color: #ffffff; }
    .bg-slate-50 { background-color: #f8fafc; }
    .bg-slate-100 { background-color: #f1f5f9; }
    .bg-blue-50 { background-color: #eff6ff; }
    .bg-blue-100\/70 { background-color: rgba(219, 234, 254, 0.7); }
    .bg-slate-900\/35 { background-color: rgba(15, 23, 42, 0.35); }
    .bg-slate-900\/40 { background-color: rgba(15, 23, 42, 0.4); }
    .border-blue-300 { border-color: #93c5fd; }
    .bg-blue-50\/60 { background-color: rgba(239, 246, 255, 0.6); }

    .backdrop-blur-md { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .backdrop-blur-\[4px\] { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

    .rounded-2xl { border-radius: 1rem; }
    .rounded-3xl { border-radius: 1.5rem; }
    .rounded-full { border-radius: 9999px; }
    .rounded-md { border-radius: 0.375rem; }
    .rounded-lg { border-radius: 0.5rem; }

    .border { border-width: 1px; border-style: solid; }
    .border-slate-200\/80 { border-color: rgba(226, 232, 240, 0.8); }
    .border-slate-200\/90 { border-color: rgba(226, 232, 240, 0.9); }
    .border-slate-200 { border-color: #e2e8f0; }
    .border-slate-100 { border-color: #f1f5f9; }
    .border-blue-200\/60 { border-color: rgba(191, 219, 254, 0.6); }
    .border-blue-200 { border-color: #bfdbfe; }
    .border-white\/80 { border-color: rgba(255, 255, 255, 0.8); }

    .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
    .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1); }
    .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1); }
    .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
    .shadow-blue-500\/25 { box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.25); }

    .gap-1 { gap: 0.25rem; }
    .gap-1\.5 { gap: 0.375rem; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }

    .w-4 { width: 1rem; }
    .h-4 { height: 1rem; }
    .w-5 { width: 1.25rem; }
    .h-5 { height: 1.25rem; }
    .w-12 { width: 3rem; }
    .h-12 { height: 3rem; }
    .w-14 { width: 3.5rem; }
    .w-52 { width: 13rem; }
    .max-w-xs { max-width: 20rem; }

    .text-blue-600 { color: #2563eb; }
    .text-blue-700 { color: #1d4ed8; }
    .text-slate-800 { color: #1e293b; }
    .text-slate-900 { color: #0f172a; }
    .text-slate-700 { color: #334155; }
    .text-slate-600 { color: #475569; }
    .text-slate-500 { color: #64748b; }
    .text-slate-400 { color: #94a3b8; }
    .text-white { color: #ffffff; }

    .text-\[10px\] { font-size: 10px; }
    .text-\[11px\] { font-size: 11px; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-base { font-size: 1rem; line-height: 1.5rem; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .text-5xl { font-size: 3rem; line-height: 1; }

    .font-black { font-weight: 900; }
    .font-extrabold { font-weight: 800; }
    .font-bold { font-weight: 700; }
    .font-medium { font-weight: 500; }

    .uppercase { text-transform: uppercase; }
    .tracking-wider { letter-spacing: 0.05em; }
    .tracking-tight { letter-spacing: -0.025em; }
    .leading-none { line-height: 1; }
    .leading-snug { line-height: 1.375; }
    .inline-block { display: inline-block; }

    .transition-transform { transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
    .transition-all { transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
    .transition-opacity { transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .duration-200 { transition-duration: 200ms; }
    .duration-300 { transition-duration: 300ms; }
    .scale-95 { transform: scale(0.95); }

    .active\:scale-90:active { transform: scale(0.9); }
    .active\:scale-95:active { transform: scale(0.95); }
    .hover\:text-slate-900:hover { color: #0f172a; }
    .hover\:bg-blue-50:hover { background-color: #eff6ff; }
    .hover\:text-blue-600:hover { color: #2563eb; }
    .active\:bg-blue-100:active { background-color: #dbeafe; }
    .focus\:outline-none:focus { outline: none; }

    .bottom-6 { bottom: 1.5rem; }
    .left-5 { left: 1.25rem; }
    .right-5 { right: 1.25rem; }
    .bottom-14 { bottom: 3.5rem; }
    .left-0 { left: 0px; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-5 { margin-bottom: 1.25rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mt-0\.5 { margin-top: 0.125rem; }

    .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.75rem; }
    .shrink-0 { flex-shrink: 0; }
    .text-center { text-align: center; }
    .text-left { text-align: left; }
    .hidden { display: none !important; }
    .opacity-0 { opacity: 0; }

    .bg-gradient-to-r {
      background-image: linear-gradient(to right, #2563eb, #4f46e5);
    }
    .hover\:from-blue-700:hover {
      background-image: linear-gradient(to right, #1d4ed8, #4338ca);
    }
  </style>
</head>
<body class="relative w-full h-full flex flex-col justify-between">

  <!-- 3Dレンダリング用キャンバス -->
  <div id="canvas-container"></div>

  <!-- 上部ヘッダー（タイマー ＆ 主役スコアカード） -->
  <header class="relative z-10 w-full pt-4 px-4 flex justify-between items-center pointer-events-none">
    
    <!-- カウントダウンタイマー（秒単位 mm:ss） -->
    <div class="pointer-events-auto bg-white/90 backdrop-blur-md px-3.5 py-1.5 rounded-2xl shadow-sm border border-slate-200/80 flex items-center gap-2">
      <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span id="timer-text" class="text-base font-black text-slate-800 tracking-wider tabular-nums">10:00</span>
    </div>

    <!-- 右側：主役スコアカード（特大太字・高視認性） -->
    <div class="pointer-events-auto bg-white/95 backdrop-blur-md px-4 py-1.5 rounded-2xl shadow-md border border-slate-200 flex items-center gap-2">
      <span class="text-[10px] font-black uppercase tracking-wider text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded-md border border-blue-200/60">SCORE</span>
      <span id="cleared-count" class="text-2xl font-black text-slate-900 tabular-nums leading-none inline-block transition-transform">0</span>
      <span class="text-xs text-slate-400 font-bold">個</span>
    </div>
  </header>

  <!-- 左下フローティング操作UI（形状選択デバッグボタン：本番環境では非表示） -->
  <div class="fixed bottom-6 left-5 z-20 hidden">
    <button id="btn-debug-toggle" title="ブロック形状を選択" class="w-12 h-12 bg-white/90 backdrop-blur-md rounded-full shadow-lg border border-slate-200/90 text-slate-600 hover:text-slate-900 active:scale-90 transition-all flex items-center justify-center focus:outline-none">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
      </svg>
    </button>
    <div id="debug-menu" class="hidden absolute bottom-14 left-0 w-52 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200/90 p-2 flex flex-col gap-1">
      <div class="text-[10px] font-black uppercase text-slate-400 px-2 py-1 tracking-wider">形状を選択 (デバッグ)</div>
      <button class="debug-phase-btn text-left px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 active:bg-blue-100 transition-all" data-phase="1">1. キューブ (27個)</button>
      <button class="debug-phase-btn text-left px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 active:bg-blue-100 transition-all" data-phase="2">2. ピラミッド (55個)</button>
      <button class="debug-phase-btn text-left px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 active:bg-blue-100 transition-all" data-phase="3">3. レゴ人形 (94個)</button>
      <button class="debug-phase-btn text-left px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 active:bg-blue-100 transition-all" data-phase="4">4. メガタワー (~185個)</button>
      <button class="debug-phase-btn text-left px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 active:bg-blue-100 transition-all" data-phase="5">5. 要塞キャッスル (~205個)</button>
      <button class="debug-phase-btn text-left px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 active:bg-blue-100 transition-all" data-phase="6">6. 凱旋アーチ門 (~195個)</button>
    </div>
  </div>

  <!-- 右下フローティング操作UI（リスタート ＆ 音量トグル） -->
  <div class="fixed bottom-6 right-5 z-20 flex items-center gap-3">
    <!-- リスタートボタン -->
    <button id="btn-restart" title="やり直す" class="w-12 h-12 bg-white/90 backdrop-blur-md rounded-full shadow-lg border border-slate-200/90 text-slate-600 hover:text-slate-900 active:scale-90 transition-all flex items-center justify-center focus:outline-none">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
      </svg>
    </button>

    <!-- 音量トグルボタン（初期OFF・高品位SVGアイコン） -->
    <button id="btn-volume" title="音量切り替え" class="w-12 h-12 bg-white/90 backdrop-blur-md rounded-full shadow-lg border border-slate-200/90 text-slate-400 active:scale-90 transition-all flex items-center justify-center focus:outline-none">
      <svg id="icon-sound-off" class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
      </svg>
      <svg id="icon-sound-on" class="w-5 h-5 text-blue-600 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
      </svg>
    </button>
  </div>

  <!-- スタート前オーバーレイ（案A：ジェスチャーバッジ方式） -->
  <div id="start-overlay" class="fixed inset-0 z-40 flex items-center justify-center p-6 bg-slate-900/35 backdrop-blur-[4px] transition-opacity duration-300">
    <div class="w-full max-w-xs bg-white/95 backdrop-blur-md rounded-3xl p-6 shadow-2xl border border-white/80 flex flex-col text-left">
      <div class="text-center font-black text-slate-900 text-lg mb-4 tracking-tight">
        制限時間 10:00
      </div>

      <div class="space-y-3 mb-4">
        <!-- メイン目的：タップ -->
        <div class="flex items-start gap-3">
          <span class="w-14 text-center shrink-0 text-[11px] font-black text-blue-700 bg-blue-100/70 px-1.5 py-0.5 rounded-lg border border-blue-200 mt-0.5">タップ</span>
          <div>
            <div class="text-sm font-extrabold text-slate-900 leading-snug">矢印の先に道があれば飛ぶ</div>
            <div class="text-[11px] text-slate-500 font-medium mt-0.5">外へ向かってスポンと射出</div>
          </div>
        </div>

        <!-- 補助操作：まわす -->
        <div class="flex items-start gap-3">
          <span class="w-14 text-center shrink-0 text-[11px] font-black text-slate-700 bg-slate-100 px-1.5 py-0.5 rounded-lg border border-slate-200/80 mt-0.5">まわす</span>
          <div>
            <div class="text-sm font-extrabold text-slate-900 leading-snug">360度スワイプで道を探す</div>
            <div class="text-[11px] text-slate-500 font-medium mt-0.5">周りを回して抜け道を確認</div>
          </div>
        </div>

        <!-- 補助操作：ズーム -->
        <div class="flex items-start gap-3">
          <span class="w-14 text-center shrink-0 text-[11px] font-black text-slate-700 bg-slate-100 px-1.5 py-0.5 rounded-lg border border-slate-200/80 mt-0.5">ズーム</span>
          <div>
            <div class="text-sm font-extrabold text-slate-900 leading-snug">2本指ピンチで奥を確認</div>
            <div class="text-[11px] text-slate-500 font-medium mt-0.5">拡大・縮小して細部をチェック</div>
          </div>
        </div>
      </div>

      <div class="text-center text-xs font-bold text-slate-500 mb-4">
        時間内にできるだけ多く消そう！
      </div>

      <button id="btn-start-action" class="tap-hint-pulse w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black text-sm tracking-wider rounded-2xl shadow-lg shadow-blue-500/25 active:scale-95 transition-all text-center focus:outline-none">
        タップしてスタート
      </button>
    </div>
  </div>

  <!-- 終了リザルトモーダル（シンプル・スコア特化） -->
  <div id="result-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm">
    <div class="w-full max-w-xs bg-white rounded-3xl p-6 shadow-2xl border border-slate-100 flex flex-col items-center text-center transform transition-all scale-95 duration-200">
      <h2 class="text-2xl font-black text-slate-900 tracking-tight mb-5">TIME UP!</h2>

      <!-- 消去スコア特大カード -->
      <div class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl py-6 px-4 mb-6 flex flex-col items-center justify-center">
        <span class="text-xs font-bold text-slate-400 tracking-wider mb-2">消去したブロック</span>
        <div class="flex items-baseline justify-center gap-1.5">
          <span id="res-score" class="text-5xl font-black text-blue-600 tabular-nums tracking-tight">0</span>
          <span class="text-base font-extrabold text-slate-600">個</span>
        </div>
      </div>

      <button id="btn-play-again" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black text-base rounded-2xl shadow-lg shadow-blue-500/25 active:scale-95 transition-all focus:outline-none">
        もう一度あそぶ
      </button>
    </div>
  </div>

  <script>
    // Web Audio APIによるSEエンジン
    const Sound = {
      ctx: null,
      isMuted: true,
      init() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!this.ctx || this.ctx.state === 'closed') {
            this.ctx = new AudioContext();
          }
          if (this.ctx && (this.ctx.state === 'suspended' || this.ctx.state === 'interrupted')) {
            this.ctx.resume();
          }
          this.unlockAudioHardware();
        } catch (e) {
          console.warn('AudioContext init error:', e);
        }
      },
      unlockAudioHardware() {
        if (!this.ctx) return;
        try {
          const buffer = this.ctx.createBuffer(1, 1, 22050);
          const source = this.ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(this.ctx.destination);
          source.start(0);
        } catch (e) {
          // サイレントガード
        }
      },
      // ボタンタップ時の軽快で上品なクリック音
      playButtonTap() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(820, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.055);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.055);
      },
      // タイムアップ時の終了通知ジングル（落ち着いたコード下降音）
      playTimeUp() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [587.33, 493.88, 392.00]; // D5 -> B4 -> G4
        notes.forEach((freq, idx) => {

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        });
      },
      playFly() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(360, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.14);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      },
      playBump() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.1);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      },
      playFallWhoosh() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const duration = 0.95;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1250, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + duration);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.18);
        gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      },
      playLand() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);

      playWaveClear() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.08;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);

  <script>
    const SPACING = 1.05;
    const CUBE_SIZE = 0.96;
    const TOTAL_TIME_SEC = 600; // 本番仕様: 10分 (600秒)
    const COLLISION_THRESHOLD = 0.88; // 判定しきい値を完全統一

    const DIRS = [
      { name: '+x', vec: new THREE.Vector3( 1,  0,  0) },
      { name: '-x', vec: new THREE.Vector3(-1,  0,  0) },
      { name: '+y', vec: new THREE.Vector3( 0,  1,  0) },
      { name: '-y', vec: new THREE.Vector3( 0, -1,  0) },
      { name: '+z', vec: new THREE.Vector3( 0,  0,  1) },
      { name: '-z', vec: new THREE.Vector3( 0,  0, -1) }
    ];

    const FACE_BASES = [
      { name: '+x', n: new THREE.Vector3( 1,  0,  0), u: new THREE.Vector3( 0,  0, -1), v: new THREE.Vector3( 0,  1,  0) },
      { name: '-x', n: new THREE.Vector3(-1,  0,  0), u: new THREE.Vector3( 0,  0,  1), v: new THREE.Vector3( 0,  1,  0) },
      { name: '+y', n: new THREE.Vector3( 0,  1,  0), u: new THREE.Vector3( 1,  0,  0), v: new THREE.Vector3( 0,  0, -1) },
      { name: '-y', n: new THREE.Vector3( 0, -1,  0), u: new THREE.Vector3( 1,  0,  0), v: new THREE.Vector3( 0,  0,  1) },
      { name: '+z', n: new THREE.Vector3( 0,  0,  1), u: new THREE.Vector3( 1,  0,  0), v: new THREE.Vector3( 0,  1,  0) },
      { name: '-z', n: new THREE.Vector3( 0,  0, -1), u: new THREE.Vector3(-1,  0,  0), v: new THREE.Vector3( 0,  1,  0) }
    ];

    const MATERIAL_CACHE = new Map();
    const SHARED_GEOMETGeometry = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);

    function initMaterialCache() {
      DIRS.forEach(dir => {
        const materials = [];
        FACE_BASES.forEach(face => {
          const canvas = document.createElement('canvas');
          canvas.width = 128;
          canvas.height = 128;
          const ctx = canvas.getContext('2d');

          const baseGrad = ctx.createLinearGradient(0, 0, 128, 128);
          baseGrad.addColorStop(0, '#ffffff');
          baseGrad.addColorStop(0.7, '#f8fafc');
          baseGrad.addColorStop(1, '#f1f5f9');
          ctx.fillStyle = baseGrad;
          ctx.fillRect(0, 0, 128, 128);

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(2, 126);
          ctx.lineTo(2, 2);
          ctx.lineTo(126, 2);
          ctx.stroke();

          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(126, 2);
          ctx.lineTo(126, 126);
          ctx.lineTo(2, 126);
          ctx.stroke();

          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 3;
          ctx.strokeRect(8, 8, 112, 112);

          const dot = dir.vec.dot(face.n);
          if (Math.abs(dot) < 0.1) {
            const u = dir.vec.dot(face.u);
            const v = dir.vec.dot(face.v);
            const angle = Math.atan2(u, v);

            ctx.save();
            ctx.translate(64, 64);
            ctx.rotate(angle);

            ctx.fillStyle = 'rgba(71, 85, 105, 0.3)';
            drawArrowShape(ctx, 0, 2);

            ctx.fillStyle = '#0f172a';
            drawArrowShape(ctx, 0, 0);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 1.8;
            ctx.stroke();

            ctx.restore();
          }

          const texture = new THREE.CanvasTexture(canvas);
          materials.push(new THREE.MeshStandardMaterial({
            map: texture,
            roughness: 0.35,
            metalness: 0.08
          }));
        });
        MATERIAL_CACHE.set(dir.name, materials);
      });
    }

    function drawArrowShape(ctx, offsetX, offsetY) {
      ctx.beginPath();
      ctx.moveTo(0 + offsetX, -37 + offsetY);
      ctx.lineTo(26 + offsetX, -7 + offsetY);
      ctx.lineTo(12 + offsetX, -7 + offsetY);
      ctx.lineTo(12 + offsetX, 36 + offsetY);
      ctx.lineTo(-12 + offsetX, 36 + offsetY);
      ctx.lineTo(-12 + offsetX, -7 + offsetY);
      ctx.lineTo(-26 + offsetX, -7 + offsetY);
      ctx.closePath();
      ctx.fill();
    }
  </script>

  <script>
    let scene, camera, renderer, controls;

      }, { passive: true });
      renderer.domElement.addEventListener('touchend', () => {
        setTimeout(() => { hasMultiTouch = false; }, 120);
      }, { passive: true });
    }

    function fitCameraToBlocks(animateTime = 800) {
      if (blocks.length === 0) return;

      const box = new THREE.Box3();
      const halfSize = CUBE_SIZE / 2;
      blocks.forEach(b => {
        const fp = b.finalPos || (b.mesh ? b.mesh.position : new THREE.Vector3());
        box.expandByPoint(new THREE.Vector3(fp.x - halfSize, fp.y - halfSize, fp.z - halfSize));
        box.expandByPoint(new THREE.Vector3(fp.x + halfSize, fp.y + halfSize, fp.z + halfSize));
      });
      const center = new THREE.Vector3();
      box.getCenter(center);

      const dir = new THREE.Vector3(0.68, 0.76, 0.94).normalize();

      const camZ = dir.clone().normalize();
      const camX = new THREE.Vector3(0, 1, 0).cross(camZ).normalize();
      const camY = camZ.clone().cross(camX).normalize();

      const corners = [
        new THREE.Vector3(box.min.x, box.min.y, box.min.z),
        new THREE.Vector3(box.min.x, box.min.y, box.max.z),
        new THREE.Vector3(box.min.x, box.max.y, box.min.z),
        new THREE.Vector3(box.min.x, box.max.y, box.max.z),
        new THREE.Vector3(box.max.x, box.min.y, box.min.z),
        new THREE.Vector3(box.max.x, box.min.y, box.max.z),
        new THREE.Vector3(box.max.x, box.max.y, box.min.z),
        new THREE.Vector3(box.max.x, box.max.y, box.max.z)
      ];

      let maxProjX = 0;
      let maxProjY = 0;
      corners.forEach(c => {
        const rel = c.clone().sub(center);
        const px = Math.abs(rel.dot(camX));
        const py = Math.abs(rel.dot(camY));
        if (px > maxProjX) maxProjX = px;
        if (py > maxProjY) maxProjY = py;
      });

      const aspect = window.innerWidth / window.innerHeight;
      const fovRad = (camera.fov * Math.PI) / 180;
      const halfTan = Math.tan(fovRad / 2);

      const distVertical = maxProjY / halfTan;
      const distHorizontal = maxProjX / (halfTan * aspect);

      const idealDistance = Math.max(distVertical, distHorizontal) * 1.10;

      const adjustedCenter = center.clone().add(new THREE.Vector3(0, -0.35, 0));
      const newPos = adjustedCenter.clone().add(dir.clone().multiplyScalar(idealDistance));

      if (animateTime > 0) {
        new TWEEN.Tween(camera.position)
          .to({ x: newPos.x, y: newPos.y, z: newPos.z }, animateTime)
          .easing(TWEEN.Easing.Cubic.Out)
          .start();
        new TWEEN.Tween(controls.target)
          .to({ x: adjustedCenter.x, y: adjustedCenter.y, z: adjustedCenter.z }, animateTime)
          .easing(TWEEN.Easing.Cubic.Out)
          .start();
      } else {
        camera.position.copy(newPos);
        controls.target.copy(adjustedCenter);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (blocks.length > 0) {
        fitCameraToBlocks(0);
      }
    }

  <script>
    // 衝突判定：生成時と実行時でしきい値を COLLISION_THRESHOLD (0.88) に完全統一
    function isGridBlockedBy(posA, posB, dirVec, threshold = COLLISION_THRESHOLD) {
      const dx = posB.x - posA.x;
      const dy = posB.y - posA.y;
      const dz = posB.z - posA.z;

      if (dirVec.x !== 0) {
        if (dirVec.x * dx <= 0.1) return false;
        return Math.abs(dy) < threshold && Math.abs(dz) < threshold;
      }
      if (dirVec.y !== 0) {
        if (dirVec.y * dy <= 0.1) return false;
        return Math.abs(dx) < threshold && Math.abs(dz) < threshold;
      }
      if (dirVec.z !== 0) {
        if (dirVec.z * dz <= 0.1) return false;
        return Math.abs(dx) < threshold && Math.abs(dy) < threshold;
      }
      return false;
    }

    function generateSolvableDirectionsForPositions(positions) {
      let remaining = [...positions];
      const assignedDirections = new Map();
      const totalBlocks = positions.length;

      for (let step = 0; step < totalBlocks; step++) {
        const candidates = [];

        remaining.forEach(p => {
          const key = `${p.x},${p.y},${p.z}`;
          const validDirs = [];

          DIRS.forEach(d => {
            let blocked = false;
            for (let i = 0; i < remaining.length; i++) {
              const other = remaining[i];
              if (other === p) continue;
              if (isGridBlockedBy(p, other, d.vec, COLLISION_THRESHOLD)) {
                blocked = true;
                break;
              }
            }
            if (!blocked) {
              validDirs.push(d);
            }
          });

          if (validDirs.length > 0) {
            candidates.push({ p, key, validDirs });
          }
        });

        if (candidates.length === 0) {
          remaining.forEach(p => {
            const key = `${p.x},${p.y},${p.z}`;
            if (!assignedDirections.has(key)) {
              assignedDirections.set(key, DIRS[Math.floor(Math.random() * DIRS.length)]);
            }
          });
          break;
        }

        const chosen = candidates[Math.floor(Math.random() * candidates.length)];
        const chosenDir = chosen.validDirs[Math.floor(Math.random() * chosen.validDirs.length)];

        assignedDirections.set(chosen.key, chosenDir);
        remaining = remaining.filter(item => item !== chosen.p);
      }

      return assignedDirections;
    }

    // 形態1: 3x3x3 キューブ (27個)
    function generatePhase1Positions() {
      const positions = [];
      for (let x = 0; x < 3; x++) {
        for (let y = 0; y < 3; y++) {
          for (let z = 0; z < 3; z++) {
            positions.push({ x, y, z });
          }
        }
      }
      return { positions, center: { x: 1, y: 1, z: 1 } };
    }

    // 形態2: 5段ピラミッド (55個)
    function generatePhase2Positions() {
      const positions = [];
      for (let level = 0; level < 5; level++) {
        const y = 4 - level;
        const s = level + 1;
        const offset = (5 - s) / 2;
        for (let ix = 0; ix < s; ix++) {
          for (let iz = 0; iz < s; iz++) {
            positions.push({ x: offset + ix, y: y, z: offset + iz });
          }
        }
      }
      return { positions, center: { x: 2, y: 2, z: 2 } };
    }

    // 形態3: レゴ人形（ミニフィグ型、計94個・トサカなし）
    function generateLegoFigurePositions() {
      const positions = [];
      const add = (x, y, z) => positions.push({ x, y, z });

      // ① 両足（Legs, Y: 0〜3）＆ つま先
      for (let x = 1; x <= 2; x++) {
        for (let y = 0; y <= 3; y++) {
          for (let z = 0; z <= 1; z++) add(x, y, z);
        }
        add(x, 0, 2);
      }
      for (let x = 4; x <= 5; x++) {
        for (let y = 0; y <= 3; y++) {
          for (let z = 0; z <= 1; z++) add(x, y, z);
        }
        add(x, 0, 2);
      }

      // ② 腰ベルト（Hips / Belt, Y: 4）
      for (let x = 1; x <= 5; x++) {
        for (let z = 0; z <= 1; z++) add(x, 4, z);
      }

      // ③ 胴体（Torso, Y: 5〜7）
      for (let y = 5; y <= 6; y++) {
        for (let x = 1; x <= 5; x++) {
          for (let z = 0; z <= 1; z++) add(x, y, z);
        }
      }
      for (let x = 2; x <= 4; x++) {
        for (let z = 0; z <= 1; z++) add(x, 7, z);
      }

      // ④ 腕＆手（Arms & Hands）
      add(0, 6, 0); add(0, 6, 1);
      add(0, 5, 1); add(0, 5, 2);
      add(0, 4, 2);

      add(6, 6, 0); add(6, 6, 1);
      add(6, 5, 1); add(6, 5, 2);
      add(6, 4, 2);

      // ⑤ 頭部（Head, Y: 8〜9）
      for (let y = 8; y <= 9; y++) {
        for (let x = 2; x <= 4; x++) {
          for (let z = 0; z <= 1; z++) add(x, y, z);
        }
      }

      return {
        positions,
        center: { x: 3, y: 4.6, z: 0.8 }
      };
    }

    // 形態4以降: 超大規模エンドレス（180〜210個級：タワー、要塞キャッスル、大門ゲート）
    function generateMegaStagePositions(waveNum) {
      const positions = [];
      const stageType = (waveNum - 4) % 3;

      if (stageType === 0) {
        const W = 5, H = 14, D = 5;
        const seed = waveNum % 3;
        for (let x = 0; x < W; x++) {
          for (let y = 0; y < H; y++) {
            for (let z = 0; z < D; z++) {
              const isCorner = (x === 0 || x === W - 1) && (z === 0 || z === D - 1);
              const isEdgeX = (x === 0 || x === W - 1);
              const isEdgeZ = (z === 0 || z === D - 1);

              if (y >= 13 && (isEdgeX || isEdgeZ)) continue;
              if (y === 12 && isCorner) continue;
              if (y === 0 && isCorner) continue;
              if (isCorner && ((y + seed) % 2 === 0)) continue;
              if ((isEdgeX || isEdgeZ) && (y >= 2 && y <= 11)) {
                if (((y + seed) % 3 === 1) && ((x + z) % 2 === 1)) continue;
              }
              positions.push({ x, y, z });
            }
          }
        }
        return { positions, center: { x: (W - 1) / 2, y: (H - 1) / 2, z: (D - 1) / 2 } };

      } else if (stageType === 1) {
        const S = 6, H = 8;
        for (let x = 0; x < S; x++) {
          for (let y = 0; y < H; y++) {
            for (let z = 0; z < S; z++) {
              const isCorner = (x === 0 || x === S - 1) && (z === 0 || z === S - 1);
              const isInner = (x >= 2 && x <= 3) && (z >= 2 && z <= 3);

              if (isInner && y >= 1) continue;
              if (y >= 6 && !isCorner) continue;
              if (y === 5 && !isCorner && ((x + z) % 2 === 1)) continue;

              positions.push({ x, y, z });
            }
          }
        }
        return { positions, center: { x: (S - 1) / 2, y: (H - 1) / 2, z: (S - 1) / 2 } };

      } else {
        // 形態6: 装飾された凱旋アーチ門（約195個）
        const positions = [];
        const add = (x, y, z) => positions.push({ x, y, z });

        // ① どっしりとした台座（Pedestal / Base, Y: 0）
        for (let z = 0; z <= 3; z++) {
          for (let x = 0; x <= 2; x++) add(x, 0, z);
          for (let x = 6; x <= 8; x++) add(x, 0, z);
        }

        // ② 主柱シャフト（Pillars, Y: 1〜6）
        for (let y = 1; y <= 6; y++) {
          for (let z = 1; z <= 2; z++) {
            add(1, y, z);
            add(2, y, z);
            add(6, y, z);
            add(7, y, z);
          }
          if (y % 2 === 1) {
            add(0, y, 1); add(0, y, 2);
            add(8, y, 1); add(8, y, 2);
          }
        }

        // ③ 柱頭キャピタル＆アーチ受け（Capitals & Arch Springers, Y: 7）
        for (let z = 1; z <= 2; z++) {
          for (let x = 0; x <= 2; x++) add(x, 7, z);
          for (let x = 6; x <= 8; x++) add(x, 7, z);
          add(3, 7, z);
          add(5, 7, z);
        }

        // ④ 水平大梁（Entablature / Architrave, Y: 8）
        for (let x = 0; x <= 8; x++) {
          for (let z = 1; z <= 2; z++) {
            if (x === 4 && z === 1) continue;
            add(x, 8, z);
          }
        }

        // ⑤ 張り出しコーニス（Cornice, Y: 9）
        for (let x = 0; x <= 8; x++) {
          for (let z = 0; z <= 3; z++) {
            if (z === 0 || z === 3 || x === 0 || x === 8 || x === 4) {
              add(x, 9, z);
            }
          }
        }

        // ⑥ 天面クラウン＆ピナクル小塔（Attic Crown & Finials, Y: 10〜11）
        add(1, 10, 1); add(1, 10, 2);
        add(7, 10, 1); add(7, 10, 2);
        add(1, 11, 1);
        add(7, 11, 1);

        for (let x = 3; x <= 5; x++) {
          add(x, 10, 1);
          add(x, 10, 2);
        }
        add(4, 11, 1);

        return {
          positions,
          center: { x: 4, y: 5.2, z: 1.5 }
        };
      }
    }
  </script>

  <script>
    function buildPhase(waveNumber, dropIn = false) {
      blocks.forEach(b => scene.remove(b.mesh));
      blocks = [];
      currentWave = waveNumber;

      let data;
      if (waveNumber === 1) data = generatePhase1Positions();
      else if (waveNumber === 2) data = generatePhase2Positions();
      else if (waveNumber === 3) data = generateLegoFigurePositions();
      else data = generateMegaStagePositions(waveNumber);

      const { positions, center } = data;
      const solvedDirections = generateSolvableDirectionsForPositions(positions);
      const waveMeshes = [];

      const dropHeight = 12.0;

      positions.forEach(p => {
        const key = `${p.x},${p.y},${p.z}`;
        const dir = solvedDirections.get(key) || DIRS[Math.floor(Math.random() * DIRS.length)];
        const materials = MATERIAL_CACHE.get(dir.name);

        const mesh = new THREE.Mesh(SHARED_GEOMETGeometry, materials);
        const finalPos = new THREE.Vector3(
          (p.x - center.x) * SPACING,
          (p.y - center.y) * SPACING,
          (p.z - center.z) * SPACING
        );

        if (dropIn) {
          mesh.position.set(finalPos.x, finalPos.y + dropHeight, finalPos.z);
        } else {
          mesh.position.copy(finalPos);
        }

        const blockData = {
          gridPos: { x: p.x, y: p.y, z: p.z },
          dir: dir,
          mesh: mesh,
          finalPos: finalPos,
          isAnimating: dropIn
        };

        mesh.userData = blockData;
        scene.add(mesh);
        blocks.push(blockData);
        waveMeshes.push({ mesh, finalPos, blockData });
      });

      if (dropIn) {
        isPhaseTransitioning = true;
        isTimerPaused = true;

        Sound.playFallWhoosh();
        fitCameraToBlocks(1100);

        const dropTracker = { progress: 0 };
        const dropDuration = 1100;

        new TWEEN.Tween(dropTracker)
          .to({ progress: 1 }, dropDuration)
          .easing(TWEEN.Easing.Cubic.Out)
          .onUpdate(() => {
            const currentOffset = dropHeight * (1 - dropTracker.progress);
            waveMeshes.forEach(item => {
              item.mesh.position.y = item.finalPos.y + currentOffset;
            });
          })
          .onComplete(() => {
            Sound.playLand();

            const springTracker = { t: 0 };
            const baseTargetY = controls.target.y;

            new TWEEN.Tween(springTracker)
              .to({ t: 1 }, 250)
              .easing(TWEEN.Easing.Linear.None)
              .onUpdate(() => {
                const damping = Math.sin(springTracker.t * Math.PI) * Math.exp(-springTracker.t * 3.0) * 0.18;
                waveMeshes.forEach(item => {
                  item.mesh.position.y = item.finalPos.y - damping;
                });
                controls.target.y = baseTargetY - damping * 0.4;
              })
              .onComplete(() => {
                waveMeshes.forEach(item => {
                  item.mesh.position.copy(item.finalPos);
                  item.blockData.isAnimating = false;
                });
                controls.target.y = baseTargetY;

                isPhaseTransitioning = false;
                isTimerPaused = false;
              })
              .start();
          })
          .start();

      } else {
        fitCameraToBlocks(0);
      }
    }

    function transitionToNextWave() {
      isPhaseTransitioning = true;
      isTimerPaused = true;

      Sound.playWaveClear();

      setTimeout(() => {
        buildPhase(currentWave + 1, true);
      }, 180);
    }
  </script>

  <script>
    function onPointerDown(e) {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    }

    function onPointerUp(e) {
      if (hasMultiTouch) return;
      const dx = Math.abs(e.clientX - pointerDownPos.x);
      const dy = Math.abs(e.clientY - pointerDownPos.y);

      if (dx < 7 && dy < 7) {
        handleTap(e.clientX, e.clientY);
      }
    }

    function handleTap(clientX, clientY) {
      if (!isGameRunning || isPhaseTransitioning) return;

      const mouse = new THREE.Vector2(
        (clientX / window.innerWidth) * 2 - 1,
        -(clientY / window.innerHeight) * 2 + 1
      );

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);

      const activeMeshes = blocks.filter(b => !b.isAnimating).map(b => b.mesh);
      const intersects = raycaster.intersectObjects(activeMeshes);

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        tryFlyBlock(hitMesh.userData);
      }
    }

    function isWorldBlockedBy(posA, posB, dirVec, threshold = COLLISION_THRESHOLD) {
      const dx = posB.x - posA.x;
      const dy = posB.y - posA.y;
      const dz = posB.z - posA.z;

      if (dirVec.x !== 0) {
        if (dirVec.x * dx <= 0.2) return false;
        return Math.abs(dy) < threshold && Math.abs(dz) < threshold;
      }
      if (dirVec.y !== 0) {
        if (dirVec.y * dy <= 0.2) return false;
        return Math.abs(dx) < threshold && Math.abs(dz) < threshold;
      }
      if (dirVec.z !== 0) {
        if (dirVec.z * dz <= 0.2) return false;
        return Math.abs(dx) < threshold && Math.abs(dy) < threshold;
      }
      return false;
    }

    function canEscape(block) {
      const posA = block.mesh.position;
      const dirVec = block.dir.vec;
      const obstacles = blocks.filter(b => b !== block && !b.isAnimating);

      for (let i = 0; i < obstacles.length; i++) {
        const posB = obstacles[i].mesh.position;
        if (isWorldBlockedBy(posA, posB, dirVec, COLLISION_THRESHOLD)) {
          return false;
        }
      }
      return true;
    }

    function tryFlyBlock(block) {
      if (block.isAnimating) return;

      if (canEscape(block)) {
        Sound.playFly();
        block.isAnimating = true;

        const targetPos = new THREE.Vector3().copy(block.mesh.position)
          .add(block.dir.vec.clone().multiplyScalar(26));

        new TWEEN.Tween(block.mesh.position)
          .to(targetPos, 280)
          .easing(TWEEN.Easing.Quadratic.In)
          .onComplete(() => {
            scene.remove(block.mesh);
            blocks = blocks.filter(b => b !== block);

            totalClearedBlocks++;
            updateScoreUI();

            if (blocks.length === 0) {
              transitionToNextWave();
            }
          })
          .start();

      } else {
        Sound.playBump();
        block.isAnimating = true;

        const bumpOffset = block.dir.vec.clone().multiplyScalar(0.22);
        const originalPos = block.mesh.position.clone();
        const bumpedPos = originalPos.clone().add(bumpOffset);

        new TWEEN.Tween(block.mesh.position)
          .to(bumpedPos, 65)
          .yoyo(true)
          .repeat(1)
          .easing(TWEEN.Easing.Quadratic.Out)
          .onComplete(() => {
            block.mesh.position.copy(originalPos);
            block.isAnimating = false;
          })
          .start();
      }
    }

    function updateScoreUI() {
      clearedCount.textContent = totalClearedBlocks;
      clearedCount.classList.remove('score-pop');
      void clearedCount.offsetWidth;
      clearedCount.classList.add('score-pop');
    }
  </script>

  <script>
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isGameRunning || isTimerPaused) return;

        remainingTimeSec = Math.max(0, remainingTimeSec - 1);

        const m = Math.floor(remainingTimeSec / 60);
        const s = remainingTimeSec % 60;
        timerText.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

        if (remainingTimeSec <= 10) {
          timerText.classList.add('timer-urgency');
        } else {
          timerText.classList.remove('timer-urgency');
        }

        if (remainingTimeSec <= 0) {
          finishGame();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function finishGame() {
      isGameRunning = false;
      stopTimer();

      // タイムアップ音の再生
      Sound.playTimeUp();

      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'GRAVITY_GAME_SCORE',
            score: totalClearedBlocks,
            wave: currentWave,
            timeUsed: TOTAL_TIME_SEC - remainingTimeSec
          }, '*');
        }
      } catch (err) {
        console.log('Gravity postMessage skipped:', err);
      }

      resScore.textContent = totalClearedBlocks;

      setTimeout(() => {
        resultModal.classList.remove('hidden');
      }, 350);
    }

    function resetGame() {
      resultModal.classList.add('hidden');
      totalClearedBlocks = 0;
      clearedCount.textContent = '0';
      remainingTimeSec = TOTAL_TIME_SEC;
      timerText.textContent = "10:00";
      timerText.classList.remove('timer-urgency');
      isPhaseTransitioning = false;
      isTimerPaused = false;
      currentWave = 1;

      buildPhase(1, false);

      controls.autoRotate = true;
      isGameRunning = false;
      stopTimer();
      startOverlay.classList.remove('opacity-0', 'pointer-events-none');
    }

    function startGame() {
      Sound.init();
      startOverlay.classList.add('opacity-0', 'pointer-events-none');
      controls.autoRotate = false;
      isGameRunning = true;
      startTimer();
    }

    startOverlay.addEventListener('click', () => {
      Sound.playButtonTap();
      startGame();
    });
    btnStartAction.addEventListener('click', (e) => {
      e.stopPropagation();
      Sound.playButtonTap();
      startGame();
    });

    btnVolume.addEventListener('click', () => {
      Sound.isMuted = !Sound.isMuted;
      if (!Sound.isMuted) {
        Sound.init();
        iconSoundOff.classList.add('hidden');
        iconSoundOn.classList.remove('hidden');
        btnVolume.classList.add('border-blue-300', 'bg-blue-50/60');
        Sound.playButtonTap();
      } else {
        iconSoundOff.classList.remove('hidden');
        iconSoundOn.classList.add('hidden');
        btnVolume.classList.remove('border-blue-300', 'bg-blue-50/60');
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !Sound.isMuted) {
        Sound.init();
      }
    });

    btnRestart.addEventListener('click', () => {
      Sound.playButtonTap();
      resetGame();
    });
    btnPlayAgain.addEventListener('click', () => {
      Sound.playButtonTap();
      resetGame();
    });

    // デバッグ用 形状選択メニュー（hidden時も安全に初期化）
    if (btnDebugToggle && debugMenu) {
      btnDebugToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        Sound.playButtonTap();
        debugMenu.classList.toggle('hidden');
      });

      document.addEventListener('click', (e) => {
        if (!debugMenu.contains(e.target) && e.target !== btnDebugToggle) {
          debugMenu.classList.add('hidden');
        }
      });

      document.querySelectorAll('.debug-phase-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          Sound.playButtonTap();
          const phase = parseInt(btn.dataset.phase, 10);
          debugMenu.classList.add('hidden');
          currentWave = phase;
          buildPhase(phase, true);
        });
      });
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);
      controls.update();
      renderer.render(scene, camera);
    }

    function startApplication() {
      initMaterialCache();
      initThree();
      resetGame();
      animate();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApplication);
    } else {
      startApplication();
    }
  </script>
</body>
